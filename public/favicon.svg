<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with Emerald Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#favBg)" stroke="#10b981" stroke-width="6" />

  <!-- 3D BIM Cube at top -->
  <g transform="translate(64, 38)">
    <polygon points="0,-16 18,-6 0,4 -18,-6" fill="#34d399" />
    <polygon points="-18,-6 0,4 0,22 -18,12" fill="#059669" />
    <polygon points="0,4 18,-6 18,12 0,22" fill="#0284c7" />
    <polyline points="0,-16 18,-6 0,4 -18,-6 0,-16" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <line x1="0" y1="4" x2="0" y2="22" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="0" cy="4" r="2.5" fill="#ffffff" />
  </g>

  <!-- High-contrast PBS Text -->
  <text x="64" y="88" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="-0.5px">
    PBS
  </text>

  <!-- Mini BIM pill -->
  <rect x="36" y="98" width="56" height="16" rx="8" fill="#10b981" />
  <text x="64" y="110" 
        text-anchor="middle" 
        fill="#050811" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="10" 
        font-weight="900" 
        letter-spacing="2px">
    BIM
  </text>
</svg>
