<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c1524"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Isometric Top Face -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Isometric Left Face -->
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Isometric Right Face -->
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradient)" stroke="url(#emeraldGrad)" stroke-width="16" />

  <!-- Blueprint Subtle Grid Lines in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128" stroke-dasharray="6,6"/>
    <line x1="64" y1="256" x2="448" y2="256" stroke-dasharray="6,6"/>
    <line x1="64" y1="384" x2="448" y2="384" stroke-dasharray="6,6"/>
    <line x1="128" y1="64" x2="128" y2="448" stroke-dasharray="6,6"/>
    <line x1="256" y1="64" x2="256" y2="448" stroke-dasharray="6,6"/>
    <line x1="384" y1="64" x2="384" y2="448" stroke-dasharray="6,6"/>
  </g>

  <!-- 3D BIM Isometric Model Icon Header -->
  <g transform="translate(256, 148)" filter="url(#glow)">
    <!-- Top Rhombus Face -->
    <polygon points="0,-48 56,-16 0,16 -56,-16" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="-56,-16 0,16 0,80 -56,48" fill="url(#cubeLeft)" opacity="0.9" />
    <!-- Right Face -->
    <polygon points="0,16 56,-16 56,48 0,80" fill="url(#cubeRight)" opacity="0.95" />
    
    <!-- Wireframe Edge Highlights -->
    <polyline points="0,-48 56,-16 0,16 -56,-16 0,-48" fill="none" stroke="#a7f3d0" stroke-width="3" />
    <line x1="0" y1="16" x2="0" y2="80" stroke="#a7f3d0" stroke-width="3" />
    <line x1="-56" y1="-16" x2="-56" y2="48" stroke="#34d399" stroke-width="3" />
    <line x1="56" y1="-16" x2="56" y2="48" stroke="#38bdf8" stroke-width="3" />
    <line x1="-56" y1="48" x2="0" y2="80" stroke="#34d399" stroke-width="3" />
    <line x1="56" y1="48" x2="0" y2="80" stroke="#38bdf8" stroke-width="3" />

    <!-- Node Vertices / BIM Anchor Points -->
    <circle cx="0" cy="-48" r="5" fill="#ffffff" />
    <circle cx="56" cy="-16" r="5" fill="#38bdf8" />
    <circle cx="-56" cy="-16" r="5" fill="#34d399" />
    <circle cx="0" cy="16" r="6" fill="#ffffff" />
    <circle cx="0" cy="80" r="5" fill="#10b981" />
  </g>

  <!-- PBS Main Typography -->
  <!-- "PBS" Text -->
  <text x="256" y="345" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" 
        font-size="124" 
        font-weight="900" 
        letter-spacing="-2px">
    PBS
  </text>

  <!-- Subtitle Badge: "BIM SOLUTION" -->
  <g transform="translate(256, 400)">
    <rect x="-140" y="-22" width="280" height="42" rx="21" fill="#10b981" />
    <text x="0" y="6" 
          text-anchor="middle" 
          fill="#050811" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="5px">
      BIM SOLUTION
    </text>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 100 L 452 60 L 412 60" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 60 412 L 60 452 L 100 452" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 412 L 452 452 L 412 452" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
</svg>
